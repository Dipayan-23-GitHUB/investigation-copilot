# Local development only. Replace credentials/secrets and configure identity, TLS and migrations before production.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: copilot
      POSTGRES_USER: copilot_dev
      POSTGRES_PASSWORD: copilot_dev_only
    ports:
      - "5432:5432"
    volumes:
      - copilot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot_dev -d copilot"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: .
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://copilot_dev:copilot_dev_only@db:5432/copilot
      AUTO_CREATE_DB: "true"
      API_ACCESS_KEY: ""
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  copilot_pgdata:
